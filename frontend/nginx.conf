server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy inverso para las APIs del Backend
    # Permite acceder a los endpoints a través del mismo puerto del Frontend (5173/80)
    # evitando bloqueos de firewall en el puerto 4000
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso para telemetría de sensores IoT hacia Node-RED
    location = /esp32/telemetry {
        proxy_pass http://node-red:1880/esp32/telemetry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
